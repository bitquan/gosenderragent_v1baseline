name: Desktop Agent CI

on:
  pull_request:
    paths:
      - '**'
  push:
    branches:
      - '**'
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  desktop-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Smoke checks
        env:
          DESKTOP_AGENT_TARGET_WORKSPACE: ${{ github.workspace }}
        run: |
          npm test
          npm run smoke

      - name: UI smoke checks
        env:
          DESKTOP_AGENT_TARGET_WORKSPACE: ${{ github.workspace }}
        run: xvfb-run -a npm run smoke:ui

      - name: Pack (Linux dir smoke)
        env:
          DESKTOP_AGENT_TARGET_WORKSPACE: ${{ github.workspace }}
        run: npm run pack

      - name: Packaged smoke checks
        env:
          DESKTOP_AGENT_TARGET_WORKSPACE: ${{ github.workspace }}
        run: xvfb-run -a npm run packaged:smoke

  desktop-build-unsigned:
    needs: desktop-smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact_name: desktop-mac-unsigned
          - os: windows-latest
            platform: win
            artifact_name: desktop-win-unsigned

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Build unsigned binaries
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DESKTOP_AGENT_TARGET_WORKSPACE: ${{ github.workspace }}
        run: npm run dist:${{ matrix.platform }}

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*
          if-no-files-found: error

  desktop-release-mac-signed:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: desktop-smoke
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Validate Apple signing secrets
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$CSC_LINK" ]
          [ -n "$CSC_KEY_PASSWORD" ]
          [ -n "$APPLE_ID" ]
          [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]
          [ -n "$APPLE_TEAM_ID" ]

      - name: Build signed + notarized mac binaries
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DESKTOP_AGENT_TARGET_WORKSPACE: ${{ github.workspace }}
        run: npm run dist:mac

      - name: Upload signed mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-signed
          path: dist/*
          if-no-files-found: error

  desktop-release-win-signed:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: desktop-smoke
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Validate Windows signing secrets
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          [ -n "$WIN_CSC_LINK" ]
          [ -n "$WIN_CSC_KEY_PASSWORD" ]

      - name: Build signed windows binaries
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          DESKTOP_AGENT_TARGET_WORKSPACE: ${{ github.workspace }}
        run: npm run dist:win

      - name: Upload signed windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win-signed
          path: dist/*
          if-no-files-found: error
