name: Baseline Proof

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  baseline-proof:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Run engine acceptance
        env:
          DESKTOP_AGENT_TARGET_WORKSPACE: ${{ github.workspace }}
        run: npm run engine:acceptance -- --full-self-host

      - name: Run baseline system checks
        env:
          DESKTOP_AGENT_TARGET_WORKSPACE: ${{ github.workspace }}
        run: |
          npm run system:check -- --area acceptance
          npm run system:check -- --area autonomy
          npm run system:check -- --area roadmap
          npm run system:check -- --area trust
          npm run system:check -- --area learning
          npm run system:check -- --area promotion

      - name: Upload proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baseline-proof
          path: |
            artifacts/**
            logs/**
            app_backup_archive/**
          if-no-files-found: ignore
